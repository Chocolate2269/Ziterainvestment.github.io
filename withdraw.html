<!DOCTYPE html><html><head><title>Withdraw - Zitera</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0A1F44;color:#fff}
.sidebar{width:250px;background:#1E3A8A;border-right:3px solid #B22234;height:100vh;position:fixed;padding:30px 20px}
.sidebar h2{text-align:center} .sidebar span{color:#B22234}
.sidebar a{color:#fff;display:block;padding:14px;margin:8px 0;text-decoration:none;border-radius:8px}
.active,.sidebar a:hover{background:#B22234}
.main{margin-left:250px;padding:40px}
.card{background:#1E3A8A;border:2px solid #B22234;border-radius:15px;padding:30px;max-width:700px;margin:auto}
input,select{width:100%;padding:14px;margin:10px 0;background:#0A1F44;border:2px solid #B22234;border-radius:8px;color:#fff;font-size:16px}
.btn{padding:14px 30px;background:#B22234;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:16px;cursor:pointer;width:100%}
</style></head><body>

<div class="sidebar">
  <h2>ZIT<span>ERA</span></h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="deposit.html">Deposit</a>
  <a href="withdraw.html" class="active">Withdraw</a>
  <a href="login.html" onclick="localStorage.clear()">Logout</a>
</div>

<div class="main">
  <h1>Withdraw Funds</h1>
  <div class="card">
    <h3>USA Bank Withdrawal</h3>
    
    <label>Select Bank</label>
    <select id="bankName">
      <option>Huntington Bank</option>
      <option>Chase Bank</option>
      <option>Bank of America</option>
      <option>Wells Fargo</option>
      <option>Credit Union</option>
      <option>Other USA Bank</option>
    </select>

    <label>Account Holder Name</label>
    <input type="text" id="accName" placeholder="Full Name">

    <label>Account Number</label>
    <input type="text" id="accNumber" placeholder="1234567890">

    <label>Routing Number</label>
    <input type="text" id="routing" placeholder="021000021">

    <label>Amount ($)</label>
    <input type="number" id="amount" placeholder="100" min="50">

    <button class="btn" onclick="submitWithdraw()">REQUEST WITHDRAWAL</button>
    <br
