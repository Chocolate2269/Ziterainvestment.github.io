<!DOCTYPE html><html><head><title>Withdraw - Zitera</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0A1F44;color:#fff}
.sidebar{width:250px;background:#1E3A8A;border-right:3px solid #B22234;height:100vh;position:fixed;padding:30px 20px;top:0;left:0}
.sidebar h2{color:#fff;text-align:center;margin-bottom:30px;font-size:26px} 
.sidebar span{color:#B22234}
.sidebar a{color:#fff;display:block;padding:14px;margin:8px 0;text-decoration:none;border-radius:8px;font-weight:600}
.sidebar a:hover,.active{background:#B22234}
.main{margin-left:250px;padding:40px}
.card{background:#1E3A8A;border:2px solid #B22234;border-radius:15px;padding:30px;max-width:700px;margin:0 auto}
input,select{width:100%;padding:14px;margin:10px 0;background:#0A1F44;border:2px solid #B22234;border-radius:8px;color:#fff;font-size:16px}
.btn{padding:14px 30px;background:#B22234;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:16px;cursor:pointer;width:100%}
.btn:hover{background:#fff;color:#B22234}
.balance-box{background:#0A1F44;border:2px solid #B22234;padding:15px;border-radius:10px;margin-bottom:20px;text-align:center}
.tab-btns{display:flex;gap:10px;margin-bottom:20px}
.tab-btn{flex:1;padding:12px;background:#0A1F44;border:2px solid #B22234;color:#fff;border-radius:8px;cursor:pointer;font-weight:700}
.tab-btn.active{background:#B22234;border-color:#B22234}
.tab-content{display:none}
.tab-content.active{display:block}
</style></head><body>

<div class="sidebar">
  <h2>ZIT<span>ERA</span></h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="deposit.html">Deposit</a>
  <a href="withdraw.html" class="active">Withdraw</a>
  <a href="login.html" onclick="localStorage.clear()">Logout</a>
</div>

<div class="main">
  <h1>Withdraw Funds</h1>
  <div class="card">
    
    <div class="balance-box">
      <p>Available Balance</p>
      <p style="font-size:28px;color:#B22234;font-weight:800">$0.00</p>
    </div>

    <div class="tab-btns">
      <button class="tab-btn active" onclick="showTab('bank')">🏦 USA Bank</button>
      <button class="tab-btn" onclick="showTab('crypto')">₿ Crypto ETH</button>
    </div>

    <!-- BANK WITHDRAW TAB -->
    <div id="bank" class="tab-content active">
      <label>Select Bank</label>
      <select id="bankName">
        <option>Huntington Bank</option>
        <option>Chase Bank</option>
        <option>Bank of America</option>
        <option>Wells Fargo</option>
        <option>Credit Union</option>
        <option>Citibank</option>
        <option>PNC Bank</option>
        <option>Other USA Bank</option>
      </select>

      <label>Account Holder Name</label>
      <input type="text" id="accName" placeholder="John Doe">

      <label>Account Number</label>
      <input type="text" id="accNumber" placeholder="1234567890">

      <label>Routing Number</label>
      <input type="text" id="routing" placeholder="021000021">

      <label>Amount to Withdraw ($)</label>
      <input type="number" id="bankAmount" placeholder="500" min="50">
    </div>

    <!-- CRYPTO WITHDRAW TAB -->
    <div id="crypto" class="tab-content">
      <label>Your ETH Wallet Address</label>
      <input type="text" id="wallet" placeholder="0xYourEthWalletAddressHere">

      <label>Amount to Withdraw (ETH)</label>
      <input type="number" id="cryptoAmount" placeholder="0.5" min="0.01" step="0.01">
    </div>

    <button class="btn" onclick="submitWithdraw()">REQUEST WITHDRAWAL</button>

    <p style="margin-top:20px;font-size:14px;color:#E5E7EB">
      ⚠️ Bank: 1-3 business days. Min $50. Crypto: 24 hours. Min 0.01 ETH.
    </p>
  </div>
</div>

<script>
function showTab(tab){
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
}

function submitWithdraw(){
  let activeTab = document.querySelector('.tab-content.active').id;
  
  if(activeTab == 'bank'){
    let bank = document.getElementById('bankName').value;
    let name = document.getElementById('accName').value;
    let acc = document.getElementById('accNumber').value;
    let routing = document.getElementById('routing').value;
    let amount = document.getElementById('bankAmount').value;
    
    if(name == "" || acc == "" || routing == "" || amount == ""){ 
      alert("Please fill all bank details"); 
      return; 
    }
    alert("Bank Withdrawal Request: $" + amount + " to " + bank + "\nWe will process in 1-3 business days.");
  
  } else {
    let wallet = document.getElementById('wallet').value;
    let amount = document.getElementById('cryptoAmount').value;
    
    if(wallet == "" || amount == ""){ 
      alert("Please fill all fields"); 
      return; 
    }
    if(!wallet.startsWith("0x")){
      alert("Enter valid ETH wallet address");
      return;
    }
    alert("ETH Withdrawal Request: " + amount + " ETH\nWe will send to your wallet soon.");
  }
}
</script>

</body></html>
