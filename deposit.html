<!DOCTYPE html>
<html>
<head>
<title>Deposit - Zitera Investment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0A0A0A;color:#fff;font-family:Arial;padding:20px;margin:0}
.box{background:#1a1a1a;border:2px solid #FFD700;border-radius:20px;padding:30px;max-width:500px;margin:20px auto}
h1{color:#FFD700;text-align:center}
.wallet{background:#000;padding:15px;border-radius:10px;margin:15px 0;border:1px solid #FFD700}
input{width:100%;padding:15px;margin:10px 0;background:#000;border:1px solid #333;border-radius:10px;color:#fff;box-sizing:border-box}
.btn{width:100%;padding:15px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
.btn:hover{background:#ffea00}
a{color:#FFD700;display:block;text-align:center;margin-top:15px}
#msg{color:#00ff88;text-align:center;margin-top:10px}
</style>
</head>
<body>
  <div class="box">
    <h1>💰 Deposit Funds</h1>
    <p>Send USDT TRC20 to the wallet below:</p>
    
    <div class="wallet">
      <b>USDT TRC20 Wallet:</b><br>
      <span id="wallet">TYX1234567890abcdef...</span>
      <button onclick="copyWallet()" style="background:#FFD700;color:#000;border:none;padding:5px 10px;border-radius:5px;margin-left:10px;cursor:pointer">Copy</button>
    </div>
    
    <input type="number" id="amount" placeholder="Amount Deposited (USD)" required>
    <input type="text" id="txid" placeholder="Transaction ID / Hash" required>
    <button class="btn" onclick="deposit()">Submit Deposit</button>
    <p id="msg"></p>
    <a href="dashboard.html">← Back to Dashboard</a>
  </div>

<script>
let currentUser = JSON.parse(localStorage.getItem('currentUser'));
if(!currentUser){window.location.href = 'login.html';}

function copyWallet(){
  navigator.clipboard.writeText(document.getElementById('wallet').innerText);
  alert('Wallet address copied!');
}

function deposit(){
  let amount = parseFloat(document.getElementById('amount').value);
  let txid = document.getElementById('txid').value;
  
  if(!amount || !txid){
    document.getElementById('msg').style.color = '#ff0000';
    document.getElementById('msg').innerText = 'Fill all fields!';
    return;
  }
  
  // Save pending deposit - you will approve it from admin
  let deposits = JSON.parse(localStorage.getItem('deposits')) || [];
  deposits.push({email: currentUser.email, amount: amount, txid: txid, status: 'pending'});
  localStorage.setItem('deposits', JSON.stringify(deposits));
  
  document.getElementById('msg').innerText = 'Deposit submitted! Waiting for admin approval.';
  setTimeout(()=> {window.location.href = 'dashboard.html';}, 2000);
}
</script>
</body>
</html>
