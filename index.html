<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ziterainvestment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.container{background:#111;padding:40px;border-radius:12px;width:90%;max-width:400px;border:1px solid #FFD700;text-align:center}
h1{color:#FFD700;margin-bottom:20px}
input{width:100%;padding:12px;margin:10px 0;background:#222;color:#fff;border:1px solid #444;border-radius:8px}
button{width:100%;padding:12px;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h1>ZITERAINVESTMENT</h1>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="handleAuth()">Sign Up / Login</button>
<p id="msg" style="color:#FFD700;margin-top:10px"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
