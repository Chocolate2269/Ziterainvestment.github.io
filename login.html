<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Zitera</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#111;padding:40px 30px;border-radius:15px;border:2px solid #FFD700;width:90%;max-width:400px}
.box h2{text-align:center;color:#FFD700;margin-bottom:25px}
input{width:100%;padding:15px;margin-bottom:15px;background:#222;border:1px solid #333;border-radius:8px;color:#fff;font-size:16px}
.btn{width:100%;padding:15px;background:#FFD700;color:#000;border:0;border-radius:8px;font-weight:800;font-size:18px}
</style></head>
<body>

<div class="box">
<h2>LOGIN TO ZITERA</h2>
<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">
<button class="btn" onclick="login()">LOGIN</button>
</div>

<script>
function login(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('password').value;
  
  if(email == '' || pass == ''){
    alert('Please fill all fields');
    return;
  }
  
  localStorage.setItem('zitera_email', email);
  localStorage.setItem('balance_' + email, '0.00');
  
  // THIS IS THE REDIRECT
  window.location.href = 'https://chocolate2269.github.io/Ziterainvestment.github.io/dashboard.html';
}
</script>
