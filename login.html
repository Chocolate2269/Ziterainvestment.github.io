<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Ziterainvestment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#0A0A0A;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:#1a1a1a;border:2px solid #FFD700;border-radius:20px;padding:40px;width:90%;max-width:400px}
h1{text-align:center;color:#FFD700;margin-bottom:30px}
input{width:100%;padding:15px;margin:10px 0;background:#000;border:1px solid #333;border-radius:10px;color:#fff}
.btn{background:#FFD700;color:#000;padding:15px;border:none;border-radius:10px;width:100%;font-weight:bold;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div class="box">
  <h1>Client Login</h1>
  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="pass" placeholder="Enter Password">
  <button class="btn" onclick="login()">Login</button>
  <p style="text-align:center;margin-top:20px;color:#888">No account? <a href="https://wa.me/234XXXXXXXXXX" style="color:#FFD700">Contact Admin</a></p>
</div>

<script>
function login(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('pass').value;
  // Demo login. Later we connect to Google Sheet
  if(email && pass){
    localStorage.setItem('user', email);
    window.location.href = 'dashboard.html';
  } else { alert('Enter Email and Password'); }
}
</script>
</body>
</html>
