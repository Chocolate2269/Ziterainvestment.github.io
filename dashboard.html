<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Zitera</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding:20px}
.header{background:#111;border-bottom:3px solid #FFD700;padding:15px 20px;margin-bottom:25px;display:flex;justify-content:space-between;align-items:center}
.header h1{color:#FFD700;font-size:20px}
.header small{color:#aaa;font-size:12px}
.balance-box{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;padding:35px;border-radius:20px;text-align:center;margin-bottom:25px}
.balance-box h2{font-size:16px;margin-bottom:10px;font-weight:600}
.balance-box h1{font-size:52px;color:#000;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:25px}
.btn{padding:18px;border:0;border-radius:12px;font-weight:800;text-decoration:none;text-align:center;font-size:18px;display:block}
.btn-deposit{background:#0ddf8f;color:#000}
.btn-withdraw{background:#FFD700;color:#000}
.logout{background:#ff4444;color:#fff;padding:10px 18px;font-size:14px;border-radius:8px;border:0}
</style></head>
<body>

<div class="header">
<div>
<h1>ZITERA</h1>
<small>Logged in: <span id="userEmail"></span></small>
</div>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="balance-box">
<h2>💰 Total Balance</h2>
<h1>$<span id="balance">0.00</span></h1>
</div>

<div class="actions">
<a href="deposit.html" class="btn btn-deposit">📥 DEPOSIT</a>
<a href="withdrawal.html" class="btn btn-withdraw">📤 WITHDRAW</a>
</div>

<script>
let userEmail = localStorage.getItem('zitera_email');
let userBalance = localStorage.getItem('balance_' + userEmail);
document.getElementById('userEmail').innerText = userEmail;
if(userBalance){
  document.getElementById('balance').innerText = parseFloat(userBalance).toFixed(2);
}
if(!userEmail){
  window.location.href = 'login.html';
}
function logout(){
  localStorage.clear();
  window.location.href = 'login.html';
}
</script>
