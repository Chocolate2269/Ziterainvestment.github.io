<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Zitera</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;display:flex}
.sidebar{width:250px;background:#111;border-right:2px solid #FFD700;padding:20px;min-height:100vh;position:fixed;left:0;top:0}
.sidebar h2{color:#FFD700;margin-bottom:30px}
.sidebar a{display:block;padding:12px;color:#fff;text-decoration:none;border-radius:8px;margin-bottom:10px}
.sidebar a:hover{background:#222;color:#FFD700}
.sidebar a.active{background:#FFD700;color:#000;font-weight:800}
.main{margin-left:270px;padding:30px;width:100%}
.card{border:2px solid #FFD700;border-radius:15px;padding:30px;background:#111;margin-bottom:20px;text-align:center}
.btn{display:inline-block;padding:15px 30px;border-radius:8px;text-decoration:none;font-weight:800;font-size:16px}
.btn-gold{background:#FFD700;color:#000}
.btn-outline{background:transparent;color:#FFD700;border:2px solid #FFD700;margin-left:15px}
@media(max-width:768px){.sidebar{position:relative;width:100%;min-height:auto}.main{margin-left:0}}
</style></head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>ZITERA</h2>
  <a href="dashboard.html" class="active">🏠 Dashboard</a>
  <a href="deposit.html">💰 Deposit</a>
  <a href="withdraw.html">💸 Withdraw</a>
  <a href="index.html" onclick="localStorage.clear()">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">
  <h1 style="color:#FFD700;margin-bottom:25px">Welcome Back!</h1>
  <div class="card">
    <p style="color:#ccc">Available Balance</p>
    <h1 style="color:#FFD700;font-size:45px">$<span id="dashBal">0.00</span></h1>
    <a href="deposit.html" class="btn btn-gold">DEPOSIT</a>
    <a href="withdraw.html" class="btn btn-outline">WITHDRAW</a>
  </div>
</div>

<script>
let email = localStorage.getItem('zitera_email');
let balance = localStorage.getItem('balance_' + email) || '0.00';
document.getElementById('dashBal').innerText = parseFloat(balance).toFixed(2);

// TAWK VISITOR INFO
var Tawk_API=Tawk_API||{};
Tawk_API.visitor = {
  name : localStorage.getItem('zitera_name') || 'User',
  email : email
};
</script>

<!-- TAWK CHAT -->

var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];

</body></html>
