<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Zitera</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body {background:#0A1F44;color:#fff}
.sidebar {width:250px;background:#1E3A8A;border-right:3px solid #B22234;height:100vh;position:fixed;padding:30px 20px}
.sidebar h2 {color:#fff;text-align:center;margin-bottom:30px;font-size:26px}
.sidebar h2 span {color:#B22234}
.sidebar a {display:block;color:#fff;padding:14px 20px;margin:8px 0;border-radius:8px;text-decoration:none;font-weight:600}
.sidebar a:hover,.active {background:#B22234}
.main {margin-left:250px;padding:50px 40px}
.welcome {font-size:22px;margin-bottom:30px}
.welcome span {color:#B22234;font-weight:800}
.card {background:#1E3A8A;border:2px solid #B22234;border-radius:15px;padding:40px;text-align:center}
.balance-label {font-size:16px;color:#E5E7EB;margin-bottom:10px}
.balance {font-size:60px;color:#B22234;font-weight:900;margin:20px 0} /* BIG BOLD BALANCE */
.btn-group {display:flex;gap:15px;justify-content:center;margin-top:20px}
.btn {padding:16px 35px;background:#B22234;color:#fff;border-radius:10px;text-decoration:none;font-weight:800;font-size:18px}
.btn:hover {background:#fff;color:#B22234}
</style>
</head>
<body>

<div class="sidebar">
  <h2>ZIT<span>ERA</span></h2>
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="deposit.html">Deposit</a>
  <a href="withdraw.html">Withdraw</a>
  <a href="login.html">Logout</a>
</div>

<div class="main">
  <div class="welcome">Welcome back, <span>John Doe</span></div> 
  
  <div class="card">
    <p class="balance-label">Total Balance</p>
    <div class="balance">$0.00</div> 
    
    <div class="btn-group">
      <a href="deposit.html" class="btn">DEPOSIT</a> <!-- FIRST -->
      <a href="withdraw.html" class="btn">WITHDRAW</a> <!-- SECOND -->
    </div>
  </div>
</div>

</body></html>
