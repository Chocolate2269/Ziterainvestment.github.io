<!DOCTYPE html><html><head><title>Dashboard - Zitera</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0A1F44;color:#fff}
.sidebar{width:250px;background:#1E3A8A;border-right:3px solid #B22234;height:100vh;position:fixed;padding:30px 20px;top:0;left:0}
.sidebar h2{color:#fff;text-align:center;margin-bottom:30px;font-size:26px} 
.sidebar span{color:#B22234}
.sidebar a{color:#fff;display:block;padding:14px;margin:8px 0;text-decoration:none;border-radius:8px;font-weight:600}
.sidebar a:hover,.active{background:#B22234}
.main{margin-left:250px;padding:40px}
.welcome{font-size:28px;margin-bottom:30px}
.welcome span{color:#B22234}
.card{background:#1E3A8A;border:2px solid #B22234;border-radius:15px;padding:30px;margin-bottom:20px}
.btn{padding:14px 30px;background:#B22234;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block;margin-right:10px}
.btn:hover{background:#fff;color:#B22234}
</style></head><body>

<div class="sidebar">
  <h2>ZIT<span>ERA</span></h2>
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="deposit.html">Deposit</a>
  <a href="withdraw.html">Withdraw</a>
  <a href="login.html" onclick="localStorage.clear()">Logout</a>
</div>

<div class="main">
  <h1 class="welcome">Welcome, <span id="userName">User</span>!</h1>
  
  <div class="card">
    <h3>Account Balance</h3>
    <p style="font-size:36px;color:#B22234;font-weight:800">$0.00</p>
  </div>

  <div class="card">
    <h3>Quick Actions</h3>
    <a href="deposit.html" class="btn">DEPOSIT</a>
    <a href="withdraw.html" class="btn">WITHDRAW</a>
  </div>
</div>

<script>
// THIS IS THE MAGIC - GET NAME FROM SIGNUP
window.onload = function(){
  let name = localStorage.getItem('userName');
  if(name){
    document.getElementById('userName').innerText = name;
  }
}
</script>

</body></html>
