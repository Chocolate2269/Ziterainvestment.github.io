<!DOCTYPE html><html><head><title>Sign Up - Zitera</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0A1F44;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#1E3A8A;border:3px solid #B22234;padding:40px;border-radius:15px;width:90%;max-width:400px;text-align:center}
.box h1{color:#fff;margin-bottom:20px} .box span{color:#B22234}
input{width:100%;padding:14px;margin:10px 0;background:#0A1F44;border:2px solid #B22234;border-radius:8px;color:#fff;font-size:16px}
.btn{width:100%;padding:14px;background:#B22234;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:16px;cursor:pointer}
p{color:#fff;margin-top:15px}
a{color:#B22234;text-decoration:none}
</style></head><body>

<div class="box">
  <h1>ZIT<span>ERA</span> SIGN UP</h1>
  <input type="text" id="name" placeholder="Full Name" required>
  <input type="email" id="email" placeholder="Email Address" required>
  <input type="password" id="password" placeholder="Password" required>
  <button class="btn" onclick="signup()">CREATE ACCOUNT</button>
  <p>Already have account? <a href="login.html">Login</a></p>
</div>

<script>
function signup(){
  let name = document.getElementById('name').value;
  let email = document.getElementById('email').value;
  let password = document.getElementById('password').value;
  
  if(name == "" || email == "" || password == ""){ 
    alert("Please fill all fields"); 
    return; 
  }
  
  // SAVE USER
  localStorage.setItem('userName', name);
  localStorage.setItem('userEmail', email);
  localStorage.setItem('balance', '0.00');
  
  alert("Account created!");
  
  // GO DIRECT TO DASHBOARD, NOT LOGIN
  window.location.href = "dashboard.html";
}
</script>
</body></html>
