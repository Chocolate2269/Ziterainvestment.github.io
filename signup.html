<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Wealtace</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0A1F44;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#1E3A8A;border:3px solid #B22234;padding:40px;border-radius:15px;width:90%;max-width:400px}
.box h2{text-align:center;color:#B22234;margin-bottom:20px;font-size:28px}
input{width:100%;padding:15px;margin:10px 0;border-radius:8px;border:2px solid #fff;background:#0A1F44;color:#fff}
.btn{width:100%;padding:15px;background:#B22234;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
.btn:hover{background:#fff;color:#B22234}
a{color:#B22234;text-decoration:none}
</style></head>
<body>
<div class="box">
  <h2>MEMBER LOGIN</h2>
  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">
  <button class="btn" onclick="window.location='dashboard.html'">LOGIN</button>
  <p style="text-align:center;margin-top:15px">No account? <a href="signup.html">Sign Up</a></p>
</div>
</body></html>
